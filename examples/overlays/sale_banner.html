<!doctype html>
<!--
  Custom VideoPip overlay. Any HTML/CSS works:
  - the page size = overlay width x height from the spec
  - background must stay transparent
  - {{key}} placeholders are replaced from `data` ({{duration}} is always available)
  - CSS animations/transitions are scrubbed frame by frame, so timing is exact
  Use it:  overlays: [{ template: overlays/sale_banner.html, data: {top: "TODAY ONLY", deal: "-35%"},
                        width: 560, height: 200, duration: 3.5 }]
-->
<html>
<head>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Arial Black", Impact, sans-serif; }
  .wrap { position: absolute; inset: 12px; display: flex; align-items: center; gap: 18px;
          padding: 0 28px; border-radius: 26px; background: linear-gradient(120deg, #ff2d55, #ff9500);
          box-shadow: 0 10px 30px rgba(0,0,0,.45);
          animation: pop .55s cubic-bezier(.2,1.6,.4,1) both, out .35s ease-in calc({{duration}}s - .35s) forwards; }
  .deal { font-size: 92px; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.25);
          animation: pulse .8s ease-in-out .6s 3 alternate; }
  .top { font-size: 30px; color: #fff; letter-spacing: 2px; line-height: 1.1; }
  .shine { position: absolute; top: 0; bottom: 0; width: 60px; left: -80px; transform: skewX(-20deg);
           background: rgba(255,255,255,.45); animation: shine 1.2s ease-in-out .5s both; }
  @keyframes pop { from { transform: scale(.2) rotate(-8deg); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes out { to { transform: translateY(-40px); opacity: 0 } }
  @keyframes pulse { to { transform: scale(1.08) } }
  @keyframes shine { to { left: 110% } }
</style>
</head>
<body>
  <div class="wrap" style="overflow:hidden">
    <div class="deal">{{deal}}</div>
    <div class="top">{{top}}</div>
    <div class="shine"></div>
  </div>
</body>
</html>
