name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-dejavu-core
      - name: Doctor
        run: videopip doctor
      - name: Generated docs are in sync
        run: python scripts/sync_docs.py --check
      - name: Tests
        run: pytest -q
